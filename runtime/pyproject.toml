[project]
name = "gemx-webui-cuda-runtime"
version = "0.1.0"
description = "Sequential CUDA execution of official GEM-X models for GEM-X Studio"
requires-python = "==3.12.*"
dependencies = [
  "torch==2.10.0+cu126",
  "torchvision==0.25.0+cu126",
  "onnxruntime-gpu==1.23.2",
  "numpy==1.26.4",
  "scipy==1.15.3",
  "opencv-python==4.11.0.86",
  "timm==0.6.7",
  "lightning==2.6.1",
  "hydra-core==1.3.0",
  "hydra-colorlog==1.2.0",
  "yacs==0.1.8",
  "einops==0.8.2",
  "pyyaml==6.0.3",
  "safetensors>=0.7,<1",
  "huggingface-hub>=0.34,<2",
  "transformers==5.3.0",
  "trimesh>=4.11,<6",
  "roma==1.6.1",
  "fvcore==0.1.5.post20221221",
  "iopath==0.1.10",
  "cloudpickle>=3,<4",
  "braceexpand==0.1.7",
  "pycocotools>=2.0.11,<3",
  "cholespy==2.2.0",
  "rtree>=1.4,<2",
  "warp-lang>=1.9,<2",
  "imageio==2.34.1",
  "imageio-ffmpeg==0.6.0",
  "av==13.1.0",
  "ffmpeg-python==0.2.0",
  "pillow>=12.1,<13",
  "setuptools==74.1.3",
  "loguru>=0.7,<1",
  "rich>=14,<16",
]

[tool.uv]
package = false
environments = ["sys_platform == 'win32' and platform_machine == 'AMD64'"]

[tool.uv.sources]
torch = { index = "pytorch-cu126" }
torchvision = { index = "pytorch-cu126" }

[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true
